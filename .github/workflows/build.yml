name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.20.1"
            java: 17
            distribution: "temurin"
            task: "build120"
          - version: "1.20.4"
            java: 17
            distribution: "temurin"
            task: "build1204"
          - version: "1.21.1"
            java: 21
            distribution: "temurin"
            task: "build121"
          - version: "1.21.4"
            java: 21
            distribution: "temurin"
            task: "build1214"
          - version: "26.2"
            java: 25
            distribution: "microsoft"
            task: "build26"

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate loader metadata filenames
        run: |
          # NeoForge 20.4.x uses FML 2.0.17, which only reads META-INF/mods.toml.
          test -f versions/1.20.4/neoforge/src/main/resources/META-INF/mods.toml
          # NeoForge 21.1+ uses FML 4+/11+, which reads META-INF/neoforge.mods.toml.
          for v in 1.21.1 1.21.4 26.2; do
            test -f versions/$v/neoforge/src/main/resources/META-INF/neoforge.mods.toml
          done

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: |
          chmod +x ./gradlew
          chmod +x ./versions/${{ matrix.version }}/gradlew

      - name: build minecraft ${{ matrix.version }}
        run: |
          cd versions/${{ matrix.version }}
          ./gradlew build

      - name: stage executable mod jars
        run: |
          mkdir -p build/dist-mods
          for dir in versions/${{ matrix.version }}/*/build/libs; do
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 1 -name "yefira-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp -v {} build/dist-mods/ \;
            fi
          done
          ls -lh build/dist-mods/

      - name: upload executable mod jars
        uses: actions/upload-artifact@v4
        with:
          name: Yefira-Mod-Jars-${{ matrix.version }}-${{ github.ref_name }}
          path: build/dist-mods/*.jar

      - name: upload sources and javadoc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yefira-Sources-Javadoc-${{ matrix.version }}-${{ github.ref_name }}
          path: |
            versions/${{ matrix.version }}/*/build/libs/*-sources.jar
            versions/${{ matrix.version }}/*/build/libs/*-javadoc.jar
