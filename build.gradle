// Global aggregation task: buildAll
tasks.register('buildAll') {
    group = 'yefira'
    description = 'Builds all Minecraft versions and collects executable mod jars into build/dist/'
    dependsOn 'build120', 'build1204', 'build121', 'build1214', 'build26'

    doLast {
        def distDir = file('build/dist')
        if (distDir.exists()) {
            distDir.deleteDir()
        }
        distDir.mkdirs()

        def loaderDirs = [
            'versions/1.20.1/fabric/build/libs',
            'versions/1.20.1/forge/build/libs',
            'versions/1.20.4/fabric/build/libs',
            'versions/1.20.4/neoforge/build/libs',
            'versions/1.21.1/fabric/build/libs',
            'versions/1.21.1/neoforge/build/libs',
            'versions/1.21.4/fabric/build/libs',
            'versions/1.21.4/neoforge/build/libs',
            'versions/26.2/fabric/build/libs',
            'versions/26.2/neoforge/build/libs'
        ]

        loaderDirs.each { path ->
            def dir = file(path)
            if (dir.exists()) {
                dir.eachFile { f ->
                    if (f.name.endsWith('.jar') && !f.name.endsWith('-sources.jar') && !f.name.endsWith('-javadoc.jar')) {
                        copy {
                            from f
                            into distDir
                        }
                        println "Staged executable mod jar: ${f.name}"
                    }
                }
            }
        }
        println "\nAll mod jars successfully staged at: ${distDir.absolutePath}"
    }
}
